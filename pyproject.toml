[build-system]
requires = ["setuptools>=61.0",]
build-backend = "setuptools.build_meta"

[project]
name = "bardi"
version="0.5.0"
authors = [{ name="Oak Ridge National Laboratory" },]
description = "A flexible machine learning data pre-processing pipeline framework."
readme = "README.md"
# TODO: re-widen to <3.13+ once setup.py's distutils usage is removed
# (distutils is gone in 3.12); duckdb is now unpinned so no longer a blocker
requires-python = ">=3.9,<3.12"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
]
dependencies = ["duckdb>=1.0,<2",
                "gensim>=4.1.2",
                "numpy>=1.21.5",
                "pandas>=1.4.4",
                "polars-u64-idx[pyarrow]>=1.6",
                "pyarrow>=14.0.1",
                "scipy>=1.10.1",
                "tokenizers>=0.13.3",
                "transformers>=4.29.2",
                "datasets>=2.12.0"
                ]

[project.urls]
Homepage = "https://github.com/DOE-NCI-MOSSAIC/bardi"
Documentation = "https://doe-nci-mossaic.github.io/bardi/"

[dependency-groups]
dev = [
    "black>=23.11.0",
    "flake8>=6.1.0",
]
